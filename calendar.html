<h1>Our Memory Calendar 🤎</h1>

<p>Click any day to add a memory.</p>

<div class="calendar-container">

    <div class="calendar-header">

        <button id="prev">&#10094;</button>

        <h2 id="monthYear"></h2>

        <button id="next">&#10095;</button>

    </div>

    <div class="weekdays">

        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>

    </div>

    <div id="calendar"></div>

</div>

<div class="popup" id="popup">

    <h2 id="selectedDate"></h2>

    <input type="file">

    <br><br>

    <textarea placeholder="Write today's memory..."></textarea>

    <br><br>

    <button>Save</button>

</div>

<script type="module" src="calendar.js"></script>
